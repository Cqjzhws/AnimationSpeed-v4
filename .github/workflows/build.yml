name: Build AnimationSpeed v4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  THEOS: ${{ github.workspace }}/theos
  SDK_VERSION: "iPhoneOS18.5.sdk"

jobs:
  build:
    name: Build TIPA + dylib
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ══════════════════════════════════════════════════════════
      # ① dylib（纯 clang，最稳定，先跑）
      # ══════════════════════════════════════════════════════════
      - name: Build dylib (pure clang, no substrate)
        id: dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          cd Tweak
          clang -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -o AnimationSpeedTweak.dylib Tweak.m
          echo "dylib size: $(du -h AnimationSpeedTweak.dylib)"
          file AnimationSpeedTweak.dylib
          mkdir -p ../artifacts
          cp AnimationSpeedTweak.dylib ../artifacts/

      # ══════════════════════════════════════════════════════════
      # ② theos 安装（完整版：fakeroot + ldid + SDK）
      # ══════════════════════════════════════════════════════════
      - name: Install fakeroot
        run: brew install fakeroot

      - name: Install ldid (签名工具)
        run: |
          git clone --depth=1 https://github.com/ProcursusTeam/ldid.git ${{ github.workspace }}/ldid
          cd ${{ github.workspace }}/ldid
          make
          cp ldid ${{ github.workspace }}/theos/bin/
          chmod +x ${{ github.workspace }}/theos/bin/ldid
          ${{ github.workspace }}/theos/bin/ldid -h 2>&1 | head -3

      - name: Clone theos
        run: |
          git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          ls "$THEOS"

      - name: Download iOS SDK (from Procursus CDN)
        run: |
          mkdir -p "$THEOS/sdks"
          curl -Ls \
            "https://github.com/theos/sdks/releases/download/master/iPhoneOS18.5.sdk.tar.zst" \
            -o "$THEOS/sdks/iPhoneOS18.5.sdk.tar.zst"
          tar -xf "$THEOS/sdks/iPhoneOS18.5.sdk.tar.zst" -C "$THEOS/sdks/"
          rm "$THEOS/sdks/iPhoneOS18.5.sdk.tar.zst"
          echo "SDK installed: $(ls $THEOS/sdks/)"

      - name: Verify theos setup
        run: |
          echo "THEOS=$THEOS"
          echo "THEOS_DEVICE_ADDR=127.0.0.1"
          echo "THEOS_DEVICE_PORT=2222"
          ls "$THEOS/bin/ldid"
          ls "$THEOS/sdks/"

      # ══════════════════════════════════════════════════════════
      # ③ Build TIPA
      # ══════════════════════════════════════════════════════════
      - name: Build App (TIPA)
        env:
          THEOS_DEVICE_ADDR: localhost
          THEOS_DEVICE_PORT: 2222
          LDID: ${{ github.workspace }}/theos/bin/ldid
        run: |
          export THEOS="$THEOS"
          cd ${{ github.workspace }}
          pwd
          ls -la
          make package FINALPACKAGE=1 THEOS="$THEOS" 2>&1
          echo "=== packages/ ==="
          find . -name "*.tipa" -o -name "*.ipa" | head -10
          ls -la packages/ 2>/dev/null || echo "no packages dir"

      - name: Copy TIPA to artifacts
        run: |
          mkdir -p artifacts
          find . -name "*.tipa" -maxdepth 2 -exec cp {} artifacts/ \; 2>/dev/null
          find . -name "*.ipa" -maxdepth 2 -exec cp {} artifacts/ \; 2>/dev/null
          echo "=== artifacts ==="
          ls -lh artifacts/

      # ══════════════════════════════════════════════════════════
      # ④ 上传产物
      # ══════════════════════════════════════════════════════════
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimationSpeed-v4-artifacts
          path: artifacts/
          if-no-files-found: error
