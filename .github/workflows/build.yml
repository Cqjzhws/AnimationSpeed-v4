name: Build AnimationSpeed v4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build dylib + IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ══════════════════════════════════════════════════════════
      # ① dylib — 纯 clang，无需 theos，最稳定
      # ══════════════════════════════════════════════════════════
      - name: Build dylib (pure clang)
        id: dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          cd Tweak
          clang -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -o AnimationSpeedTweak.dylib Tweak.m
          echo "dylib size: $(du -h AnimationSpeedTweak.dylib | cut -f1)"
          mkdir -p ../artifacts
          cp AnimationSpeedTweak.dylib ../artifacts/

      # ══════════════════════════════════════════════════════════
      # ② IPA — Xcode xcodebuild，不需要 theos，不需要 dm.pl
      # ══════════════════════════════════════════════════════════
      - name: Build App & IPA
        id: ipa
        continue-on-error: true
        run: |
          set -e
          WS="${{ github.workspace }}"
          cd "$WS"

          # Xcode 项目名
          SCHEME="AnimationSpeed"
          CONFIG="Release"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          DST="generic/platform=iOS"

          echo "=== Build Xcode project ==="
          xcodebuild -project AnimationSpeed.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination "$DST" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            SWIFT_VERSION=5.0 \
            -archivePath build/AnimationSpeed \
            -archive

          echo ""
          echo "=== Package as .ipa ==="
          # IPA = zip 格式的 .app 目录
          mkdir -p artifacts

          APP_PATH="build/AnimationSpeed.xcarchive/Products/Applications/AnimationSpeed.app"
          if [ -d "$APP_PATH" ]; then
            echo "Found app: $APP_PATH"
            echo "App size: $(du -sh "$APP_PATH" | cut -f1)"
            # 打 zip，改扩展名为 .ipa（TrollStore 接受）
            cd "$(dirname "$APP_PATH")"
            zip -r "$WS/artifacts/AnimationSpeed_4.0.0.ipa" "$(basename "$APP_PATH")" -x "*.DS_Store"
            echo "IPA created: $(du -h "$WS/artifacts/AnimationSpeed_4.0.0.ipa" | cut -f1)"
          else
            echo "ERROR: App bundle not found at $APP_PATH"
            ls build/AnimationSpeed.xcarchive/Products/Applications/ 2>/dev/null || echo "No Applications dir"
            find build/ -name "*.app" 2>/dev/null || echo "No .app found"
          fi

          echo ""
          echo "=== artifacts/ ==="
          ls -lh artifacts/

      # ══════════════════════════════════════════════════════════
      # ③ 显示产物
      # ══════════════════════════════════════════════════════════
      - name: Show artifacts
        run: |
          echo "=== artifacts/ ==="
          ls -lh artifacts/ 2>/dev/null || echo "(empty)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimationSpeed-v4-artifacts
          path: artifacts/
          if-no-files-found: error
