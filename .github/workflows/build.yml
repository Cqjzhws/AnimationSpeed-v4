name: Build AnimationSpeed v4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build dylib + IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ══════════════════════════════════════════════════════════
      # ① dylib — 纯 clang，无需 theos，最稳定
      # ══════════════════════════════════════════════════════════
      - name: Build dylib (pure clang)
        id: dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          cd Tweak
          clang -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -o AnimationSpeedTweak.dylib Tweak.m
          echo "dylib size: $(du -h AnimationSpeedTweak.dylib | cut -f1)"
          mkdir -p ../artifacts
          cp AnimationSpeedTweak.dylib ../artifacts/

      # ══════════════════════════════════════════════════════════
      # ② IPA — Xcode xcodebuild，不需要 theos，不需要 dm.pl
      # ══════════════════════════════════════════════════════════
      - name: Build App & IPA
        id: ipa
        continue-on-error: true
        run: |
          set -e
          WS="${{ github.workspace }}"
          cd "$WS"

          # Xcode 项目名
          SCHEME="AnimationSpeed"
          CONFIG="Release"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          DST="generic/platform=iOS"

          echo "=== Build Xcode project (build action, not archive) ==="
          xcodebuild -project AnimationSpeed.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -destination "$DST" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            SWIFT_VERSION=5.0 \
            BUILD_LIBRARY_FOR_DISTRIBUTION=NO \
            -derivedDataPath build/DerivedData \
            build 2>&1 | tail -10

          echo ""
          echo "=== Find .app bundle ==="
          APP_PATH=$(find build/DerivedData -name "AnimationSpeed.app" -type d 2>/dev/null | head -1)
          echo "Found: $APP_PATH"
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            echo "App size: $(du -sh "$APP_PATH" | cut -f1)"

            # 用 codesign 强制重签，加 entitlements（TrollStore 需要 no-sandbox）
            ENT="$WS/entitlements.plist"
            echo "Signing with entitlements: $ENT"
            codesign --force --sign - --entitlements "$ENT" --deep "$APP_PATH" 2>&1 | tail -5
            echo "Verify: $(codesign -d --entitlements - "$APP_PATH" 2>&1 | grep -c no-sandbox) entitlements lines"

            mkdir -p "$WS/artifacts"
            # TrollStore 要求的 IPA 格式: Payload/AppName.app/
            STAGE="$WS/build/ipa_stage"
            rm -rf "$STAGE"
            mkdir -p "$STAGE/Payload"
            cp -R "$APP_PATH" "$STAGE/Payload/AnimationSpeed.app"
            cd "$STAGE"
            zip -r "$WS/artifacts/AnimationSpeed_4.0.1.ipa" "Payload" -x "*.DS_Store"
            echo "IPA size: $(du -h "$WS/artifacts/AnimationSpeed_4.0.1.ipa" | cut -f1)"
          else
            echo "ERROR: .app not found"
            find build/DerivedData -name "*.app" -type d 2>/dev/null | head -5
          fi

          echo ""
          echo "=== artifacts/ ==="
          ls -lh artifacts/

      # ══════════════════════════════════════════════════════════
      # ③ 显示产物
      # ══════════════════════════════════════════════════════════
      - name: Show artifacts
        run: |
          echo "=== artifacts/ ==="
          ls -lh artifacts/ 2>/dev/null || echo "(empty)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimationSpeed-v4-artifacts
          path: artifacts/
          if-no-files-found: error
