name: Build AnimationSpeed v4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Tweak (dylib + TIPA)
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ══════════════════════════════════════════════════════════
      # ① dylib — 纯 clang，最稳定
      # ══════════════════════════════════════════════════════════
      - name: Build dylib (pure clang)
        id: dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK: $SDK"
          cd Tweak
          clang -arch arm64 -dynamiclib \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -undefined dynamic_lookup -fobjc-arc \
            -framework Foundation \
            -framework UIKit \
            -framework QuartzCore \
            -o AnimationSpeedTweak.dylib Tweak.m
          echo "dylib size: $(du -h AnimationSpeedTweak.dylib | cut -f1)"
          mkdir -p ../artifacts
          cp AnimationSpeedTweak.dylib ../artifacts/
          echo "dylib_built=true" >> $GITHUB_OUTPUT

      # ══════════════════════════════════════════════════════════
      # ② TIPA — theos 工程（可选，失败不阻断 dylib）
      # ══════════════════════════════════════════════════════════
      - name: Install theos + deps
        id: theos_install
        continue-on-error: true
        run: |
          set -e

          # 安装 fakeroot（theos 打包需要）
          if ! command -v fakeroot &>/dev/null; then
            brew install fakeroot || true
          fi
          echo "fakeroot: $(command -v fakeroot || echo 'not found')"

          # 安装 ldid（签名工具，brew 安装在 /opt/homebrew/bin/ldid）
          if ! command -v ldid &>/dev/null; then
            brew install ldid
          fi
          echo "ldid: $(command -v ldid || echo 'not found')"

          # 克隆 theos（只做一次，缓存利用）
          THEOS="${{ github.workspace }}/theos"
          if [ ! -d "$THEOS" ]; then
            git clone --depth=1 https://github.com/theos/theos.git "$THEOS"
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          ls "$THEOS"
          echo "theos_installed=true" >> $GITHUB_OUTPUT

      - name: Build App (TIPA)
        if: steps.theos_install.outputs.theos_installed == 'true'
        continue-on-error: true
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -e
          cd /home/runner/work/AnimationSpeed-v4/AnimationSpeed-v4
          pwd
          ls -la

          # theos 环境变量
          export THEOS="${{ github.workspace }}/theos"
          export PATH="$THEOS/bin:$PATH"

          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 2>&1 | tail -20

          # 找 .tipa 或 .ipa 产物
          find . -name "*.tipa" -o -name "*.ipa" | while read f; do
            echo "Found: $f ($(du -h "$f" | cut -f1))"
            cp "$f" artifacts/ 2>/dev/null && echo "copied to artifacts/"
          done

          ls -la artifacts/ 2>/dev/null || echo "(no artifacts dir)"

      # ══════════════════════════════════════════════════════════
      # ③ 显示产物
      # ══════════════════════════════════════════════════════════
      - name: Show artifacts
        run: |
          echo "=== artifacts/ ==="
          ls -lh artifacts/ 2>/dev/null || echo "(empty)"
          echo ""
          echo "=== dylib info ==="
          file artifacts/AnimationSpeedTweak.dylib 2>/dev/null || echo "no dylib"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnimationSpeed-v4-artifacts
          path: artifacts/
          if-no-files-found: error
